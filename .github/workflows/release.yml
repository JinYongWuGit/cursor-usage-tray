name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Run Tests
        run: dotnet test -c Release --no-restore

      - name: Build Solution (Release)
        run: dotnet build -c Release --no-restore

      - name: Package Release Archives
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null
          Compress-Archive -Path "bin\Release\net10.0-windows\*" -DestinationPath "$dist\CursorUsageTray-net10-windows.zip" -Force
          Compress-Archive -Path "bin\Release\net48\*" -DestinationPath "$dist\CursorUsageTray-net48.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: Cursor Usage Tray ${{ github.ref_name || inputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/CursorUsageTray-net10-windows.zip
            dist/CursorUsageTray-net48.zip
